services:
  gemsapi:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_KEY}
    container_name: gemsapi
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
